name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
      - name: Build
        run: lake build
      - name: The portable model builds without SQLite
        run: lake build LeanDbModel
      - name: Precompiled consumers load the engine and native interpreter
        run: lake build FixturePrecompiled
      - name: Tests
        run: lake build leandb_tests && ./.lake/build/bin/leandb_tests
      - name: DDD tests
        run: lake build leandb_ddd_tests && ./.lake/build/bin/leandb_ddd_tests
      - name: Model tests (in memory and on SQLite)
        run: lake build leandb_model_tests && ./.lake/build/bin/leandb_model_tests
