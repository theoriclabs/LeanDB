# `LeanDb.Model` tests: the data model (represent, entities, constraints, links,
# Changes) and its programs run in memory and on SQLite (`LeanDb.Native`).
[[lean_lib]]
name = "TestsModel"

[[lean_exe]]
name = "leandb_model_tests"
root = "TestsModel"

[[lean_lib]]
name = "CheckAxioms"
