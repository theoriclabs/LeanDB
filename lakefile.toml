name = "leandb"
version = "0.5.0"
defaultTargets = ["LeanDb", "LeanDbModel", "LeanDbNative"]

# Pinned and verified against lean4 v4.33.0; bump in lockstep with
# lean-toolchain.
[[require]]
name = "leansqlite"
git = "https://github.com/leanprover/leansqlite"
rev = "0be4df908d1a8e75b58961041e2b4973692623df"

# Wire codecs and checked value types for `LeanDb.Model`.
[[require]]
name = "leanontology"
git = "https://github.com/theoriclabs/leanontology"
rev = "322a4c12631dd8ece6ae9841a5e6b630d08d1e3b"

# Keep the engine, portable model, and SQLite interpreter in separate libraries.
# A precompiled consumer of the engine must not load the model or interpreter
# without their LeanOntology dependencies in its import closure.
[[lean_lib]]
name = "LeanDb"

# The portable model alone: `lake build LeanDbModel` never compiles SQLite.
[[lean_lib]]
name = "LeanDbModel"
roots = ["LeanDb.Model"]
# Match the module initializer so Lake loads this as a Lean plugin after its
# dependencies, rather than as an external library before LeanOntology.
libName = "leandb_LeanDb_Model"

[[lean_lib]]
name = "LeanDbNative"
roots = ["LeanDb.Native"]
libName = "leandb_LeanDb_Native"

# Regression: precompiled consumers can load the client and native interpreter.
[[lean_lib]]
name = "FixturePrecompiled"
globs = ["FixturePrecompiled", "FixturePrecompiled.Native"]
precompileModules = true


